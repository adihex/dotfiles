# ── Server ───────────────────────────────────────────
# Server option (-s), not a session option. Default is `on`, which exits the
# server when its last session closes -- that makes a launchd-supervised server
# look dead the moment you close your last session. local.tmux-server.plist
# checks for `main` before recreating it, so the server must outlive its sessions
# for that to mean anything.
set -s exit-empty off

# ── General ──────────────────────────────────────────
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g escape-time 10                    # faster key response
set -g focus-events on                   # needed for Ghostty
set -g extended-keys-format 'csi-u'

# ── Mouse ────────────────────────────────────────────
set -g mouse on

# ── Visual ───────────────────────────────────────────
set -g status-position top
set -g status-style 'bg=#161b22 fg=#c9d1d9'
set -g status-left ' #S '
set -g status-left-style 'bg=#30363d fg=#58a6ff bold'
set -g status-right ' %H:%M '
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style 'bg=#58a6ff fg=#0d1117 bold'
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#58a6ff'
set -g message-style 'bg=#161b22 fg=#c9d1d9'
# ── Key bindings (more natural pane nav) ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits (more intuitive) ──────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Vi mode in copy buffer ───────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Reload config ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
